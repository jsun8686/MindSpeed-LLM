model:
  model_id: qwen3_moe
  model_name_or_path: ./model_weights/Qwen3-30B-A3B/
  trust_remote_code: True
  train_from_scratch: False
  tokenizer_name_or_path: ./model_weights/Qwen3-30B-A3B/
  init_model_with_meta_device: True

data:
  dataset: alpaca_full
  template: qwen3
  cutoff_len: 4096
  max_samples: 100000
  overwrite_cache: True
  preprocessing_num_workers: 1

parallel:
  fsdp_size: 8
  fsdp_modules:
    - model.layers.{*}
    - model.embed_tokens
    - lm_head
  tp_size: 1
  ep_size: 1
  ep_modules:
    - model.layers.{*}.mlp.experts
  ep_fsdp_size: 1
  ep_fsdp_modules:
    - model.layers.{*}.mlp.experts
  ep_dispatcher: eager
  recompute: True
  recompute_modules:
    - model.layers.{*}
  # ---- async activation offload to the MemFabric remote DRAM pool ----
  activation_offload: True
  activation_offload_backend: memfabric
  offload_pool_size_gb: 8          # remote DRAM acquired per rank
  offload_extend_block_gb: 1       # granularity of each extend_remote_mem request
  offload_register_mode: per_tensor
  mf_store_url: tcp://10.0.0.1:8572   # config store hosted on the FIRST FAR node
  mf_nic: tcp://10.0.0.2:10005        # RoCE nic of THIS training node
  mf_world_size: 16                   # window capacity: 8 training ranks + FAR daemons
  mf_pool_id: 0

training:
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 1
  dataloader_num_workers: 4
  seed: 42
  dataloader_drop_last: True
  output_dir: ./output
  optimizer: adamw
  lr: 1e-05
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_epsilon: 1e-08
  max_grad_norm: 1.0
  lr_scheduler_type: cosine
  warmup_ratio: 0.0
  min_lr: 1e-06
  num_train_epochs: 3.0
  max_steps: 2000
  save_steps: 500
  logging_steps: 1

optimization:
  use_fused_rmsnorm: True
  use_fused_rotary_pos_emb: True
  moe_grouped_gemm: True
  use_flash_attn: True
